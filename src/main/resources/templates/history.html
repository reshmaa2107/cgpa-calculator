<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>History — CGPA Calculator</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#1a1a2e}
        .container{max-width:900px;margin:2rem auto;padding:0 1.5rem}
        .card{background:white;border-radius:12px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
        .card h2{font-size:1.1rem;font-weight:600;margin-bottom:1.2rem}
        table{width:100%;border-collapse:collapse;font-size:0.88rem}
        th{background:#f8faff;padding:0.7rem 0.8rem;text-align:left;font-weight:600;color:#555;border-bottom:1.5px solid #eef0f5}
        td{padding:0.7rem 0.8rem;border-bottom:1px solid #f0f2f7}
        .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:600;font-size:0.82rem}
        .high{background:#dcfce7;color:#166534}
        .mid{background:#fef9c3;color:#854d0e}
        .low{background:#fee2e2;color:#991b1b}
        .empty{color:#aaa;text-align:center;padding:2rem}
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h2>Grade history</h2>
        <table>
            <thead>
            <tr><th>Date</th><th>Semester</th><th>Course</th><th>Code</th><th>Credits</th><th>Grade</th><th>Points</th></tr>
            </thead>
            <tbody id="history-body">
            <tr><td colspan="7" class="empty">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script th:inline="javascript">
    const STUDENT_ID = [[${studentId}]];
    async function loadHistory() {
      const res = await fetch(`/api/history/${STUDENT_ID}`);
      const data = await res.json();
      const tbody = document.getElementById('history-body');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No history yet. Start adding grades!</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(h => {
        const gp = h.gradePoints;
        const cls = gp >= 8 ? 'high' : gp >= 6 ? 'mid' : 'low';
        const date = new Date(h.recordedAt).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
        return `<tr>
          <td>${date}</td>
          <td>Semester ${h.semesterNo}</td>
          <td>${h.courseName}</td>
          <td>${h.courseCode ?? '—'}</td>
          <td>${h.creditHours}</td>
          <td><span class="pill ${cls}">${h.letterGrade}</span></td>
          <td>${h.gradePoints}</td>
        </tr>`;
      }).join('');
    }
    loadHistory();
</script>
</body>
</html>
