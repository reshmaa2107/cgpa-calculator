<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Register — CGPA Calculator</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .card{background:white;border-radius:14px;padding:2.5rem;width:100%;max-width:440px;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
        .logo{text-align:center;margin-bottom:1.5rem}
        .logo h1{font-size:1.5rem;color:#1a1a2e}
        .logo p{color:#777;font-size:0.9rem;margin-top:4px}
        .form-group{margin-bottom:1rem}
        .form-group label{display:block;font-size:0.85rem;font-weight:500;color:#555;margin-bottom:6px}
        .form-group input{width:100%;padding:0.65rem 0.9rem;border:1.5px solid #dde3ed;border-radius:8px;font-size:0.95rem;outline:none;transition:border-color 0.2s}
        .form-group input:focus{border-color:#4f46e5}
        .btn{width:100%;padding:0.75rem;background:#4f46e5;color:white;border:none;border-radius:8px;font-size:1rem;font-weight:500;cursor:pointer;margin-top:0.5rem}
        .btn:hover{background:#4338ca}
        .alert{padding:0.75rem;border-radius:8px;margin-bottom:1rem;font-size:0.88rem}
        .alert-error{background:#fee2e2;color:#991b1b}
        .footer{text-align:center;margin-top:1.2rem;font-size:0.88rem;color:#777}
        .footer a{color:#4f46e5;text-decoration:none}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <h1>🎓 CGPA Calculator</h1>
        <p>Create your account</p>
    </div>
    <div id="msg"></div>
    <div class="form-group"><label>Full name</label><input type="text" id="name" placeholder="Arjun Kumar"/></div>
    <div class="form-group"><label>College name</label><input type="text" id="college" placeholder="Anna University"/></div>
    <div class="form-group"><label>Email address</label><input type="email" id="email" placeholder="arjun@example.com"/></div>
    <div class="form-group"><label>Roll number</label><input type="text" id="roll" placeholder="CS2021001"/></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="minimum 6 characters"/></div>
    <button class="btn" onclick="register()">Create account</button>
    <div class="footer">Already have an account? <a href="/login">Sign in</a></div>
</div>
<script>
    async function register() {
      const name=document.getElementById('name').value.trim();
      const college=document.getElementById('college').value.trim();
      const email=document.getElementById('email').value.trim();
      const roll=document.getElementById('roll').value.trim();
      const password=document.getElementById('password').value;
      const msg=document.getElementById('msg');
      if(!name||!email||!roll||!password){msg.innerHTML='<div class="alert alert-error">All fields except college are required.</div>';return;}
      const res=await fetch('/api/students/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,college,email,rollNumber:roll,password})});
      if(res.ok){msg.innerHTML='<div class="alert" style="background:#dcfce7;color:#166534">Account created! Redirecting...</div>';setTimeout(()=>window.location.href='/login',1000);}
      else{const err=await res.json();msg.innerHTML=`<div class="alert alert-error">${err.error??'Registration failed.'}</div>`;}
    }
</script>
</body>
</html>
