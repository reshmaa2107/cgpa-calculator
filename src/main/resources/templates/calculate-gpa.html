<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calculate GPA — CGPA Calculator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a1a2e; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; }
        .card {
          background: white;
          border-radius: 12px;
          padding: 1.5rem;
          box-shadow: 0 2px 12px rgba(0,0,0,0.06);
          margin-bottom: 1.5rem;
        }
        .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.2rem; }
        .row {
          display: grid;
          grid-template-columns: 2fr 1fr 1fr auto;
          gap: 10px;
          align-items: end;
          margin-bottom: 10px;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.8rem; font-weight: 500; color: #666; }
        .form-group input,
        .form-group select {
          padding: 0.55rem 0.8rem;
          border: 1.5px solid #dde3ed;
          border-radius: 8px;
          font-size: 0.9rem;
          outline: none;
          transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus { border-color: #4f46e5; }
        .btn {
          padding: 0.55rem 1rem;
          border: none;
          border-radius: 8px;
          font-size: 0.9rem;
          font-weight: 500;
          cursor: pointer;
          transition: background 0.2s;
        }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-danger { background: #fee2e2; color: #991b1b; }
        .btn-danger:hover { background: #fecaca; }
        .btn-add {
          background: #eef2ff;
          color: #4f46e5;
          width: 100%;
          margin-top: 0.5rem;
          padding: 0.65rem;
        }
        .btn-add:hover { background: #e0e7ff; }
        .btn-calculate {
          width: 100%;
          padding: 0.85rem;
          margin-top: 1rem;
          font-size: 1rem;
        }
        .result {
          background: linear-gradient(135deg, #4f46e5, #7c3aed);
          color: white;
          border-radius: 12px;
          padding: 2rem;
          text-align: center;
        }
        .result .gpa-num {
          font-size: 4rem;
          font-weight: 700;
          line-height: 1;
        }
        .result .gpa-label {
          font-size: 0.9rem;
          opacity: 0.8;
          margin-top: 8px;
        }
        .result .gpa-status {
          margin-top: 12px;
          font-size: 1.1rem;
          font-weight: 500;
        }
        .result .gpa-breakdown {
          margin-top: 16px;
          font-size: 0.85rem;
          opacity: 0.75;
        }
        .info-box {
          background: #eef2ff;
          border-radius: 8px;
          padding: 0.85rem 1rem;
          font-size: 0.88rem;
          color: #3730a3;
          margin-bottom: 1.2rem;
        }
        @media (max-width: 600px) {
          .row { grid-template-columns: 1fr 1fr; }
          .row .form-group:first-child { grid-column: span 2; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card">
        <h2>Calculate semester GPA</h2>
        <div class="info-box">
            Enter your courses, credit hours and grades below. GPA is calculated as
            the weighted average of grade points across all credit hours.
        </div>

        <div id="courses"></div>

        <button class="btn btn-add" onclick="addRow()">+ Add course</button>
        <button class="btn btn-primary btn-calculate" onclick="calculate()">
            Calculate GPA
        </button>
    </div>

    <div class="result" id="result" style="display:none">
        <div class="gpa-num" id="gpa-val">0.00</div>
        <div class="gpa-label">Semester GPA (out of 10)</div>
        <div class="gpa-status" id="gpa-status"></div>
        <div class="gpa-breakdown" id="gpa-breakdown"></div>
    </div>
</div>

<script>
    const GRADES = {
      'O':   10,
      'A+':  9,
      'A':   8,
      'B+':  7,
      'B':   6,
      'C':   5,
      'F':   0
    };

    let count = 0;

    function addRow() {
      count++;
      const container = document.getElementById('courses');
      const div = document.createElement('div');
      div.className = 'row';
      div.id = 'row-' + count;
      div.innerHTML = `
        <div class="form-group">
          <label>Course name</label>
          <input type="text" placeholder="Mathematics" />
        </div>
        <div class="form-group">
          <label>Credits</label>
          <input type="number" placeholder="4" min="1" max="6" />
        </div>
        <div class="form-group">
          <label>Grade</label>
          <select>
            ${Object.entries(GRADES).map(([g, p]) =>
              `<option value="${g}">${g} — ${p} pts</option>`
            ).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button class="btn btn-danger"
            onclick="document.getElementById('row-${count}').remove()">✕</button>
        </div>`;
      container.appendChild(div);
    }

    function calculate() {
      const rows = document.querySelectorAll('#courses .row');
      if (rows.length === 0) {
        alert('Please add at least one course.');
        return;
      }

      let totalCredits = 0;
      let weightedPoints = 0;
      let courseCount = 0;

      rows.forEach(row => {
        const inputs  = row.querySelectorAll('input');
        const credits = parseFloat(inputs[1].value) || 0;
        const grade   = row.querySelector('select').value;
        const pts     = GRADES[grade] ?? 0;

        if (credits > 0) {
          totalCredits    += credits;
          weightedPoints  += pts * credits;
          courseCount++;
        }
      });

      if (totalCredits === 0) {
        alert('Please enter valid credit hours.');
        return;
      }

      const gpa = (weightedPoints / totalCredits).toFixed(2);
      const g   = parseFloat(gpa);

      let status = '';
      if      (g >= 9.5) status = 'Outstanding 🌟';
      else if (g >= 9)   status = 'Excellent 🎉';
      else if (g >= 8)   status = 'Very good 👍';
      else if (g >= 7)   status = 'Good ✅';
      else if (g >= 6)   status = 'Above average 📚';
      else if (g >= 5)   status = 'Average 💪';
      else               status = 'Needs improvement ⚠️';

      document.getElementById('gpa-val').textContent       = gpa;
      document.getElementById('gpa-status').textContent    = status;
      document.getElementById('gpa-breakdown').textContent =
        `${courseCount} course${courseCount > 1 ? 's' : ''} · ${totalCredits} total credits · ${weightedPoints.toFixed(1)} weighted points`;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    // Start with 3 rows
    addRow();
    addRow();
    addRow();
</script>
</body>
</html>
