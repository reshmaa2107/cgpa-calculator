<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CGPA Calculator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: 'Segoe UI', sans-serif;
          background: #f0f4f8;
          color: #1a1a2e;
          min-height: 100vh;
        }

        header {
          background: #1a1a2e;
          color: white;
          padding: 1.2rem 2rem;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        header h1 { font-size: 1.4rem; font-weight: 600; }
        header span { font-size: 1.6rem; }

        .container { max-width: 860px; margin: 2.5rem auto; padding: 0 1.5rem; }

        .card {
          background: white;
          border-radius: 12px;
          padding: 1.8rem;
          box-shadow: 0 2px 12px rgba(0,0,0,0.07);
          margin-bottom: 2rem;
        }
        .card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.2rem; color: #1a1a2e; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.82rem; font-weight: 500; color: #555; }
        .form-group input {
          padding: 0.6rem 0.85rem;
          border: 1.5px solid #dde3ed;
          border-radius: 8px;
          font-size: 0.95rem;
          transition: border-color 0.2s;
          outline: none;
        }
        .form-group input:focus { border-color: #4f46e5; }

        .btn {
          padding: 0.65rem 1.6rem;
          border: none;
          border-radius: 8px;
          font-size: 0.95rem;
          font-weight: 500;
          cursor: pointer;
          transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }

        .student-list { display: flex; flex-direction: column; gap: 10px; }
        .student-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 0.9rem 1.1rem;
          border: 1.5px solid #eef0f5;
          border-radius: 10px;
          transition: border-color 0.2s;
        }
        .student-item:hover { border-color: #4f46e5; }
        .student-info strong { font-size: 0.95rem; }
        .student-info span { font-size: 0.82rem; color: #777; margin-left: 8px; }
        .btn-sm {
          padding: 0.4rem 1rem;
          font-size: 0.85rem;
          border-radius: 6px;
          background: #eef2ff;
          color: #4f46e5;
          border: none;
          cursor: pointer;
          font-weight: 500;
          text-decoration: none;
        }
        .btn-sm:hover { background: #e0e7ff; }

        .alert {
          padding: 0.75rem 1rem;
          border-radius: 8px;
          margin-bottom: 1rem;
          font-size: 0.9rem;
        }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .alert-success { background: #dcfce7; color: #166534; }

        @media (max-width: 600px) {
          .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <span>🎓</span>
    <h1>CGPA Calculator</h1>
</header>

<div class="container">

    <!-- Create Student -->
    <div class="card">
        <h2>Add new student</h2>
        <div id="msg"></div>
        <div class="form-row">
            <div class="form-group">
                <label>Full name</label>
                <input type="text" id="name" placeholder="Arjun Kumar"/>
            </div>
            <div class="form-group">
                <label>Roll number</label>
                <input type="text" id="roll" placeholder="CS2021001"/>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="arjun@example.com"/>
            </div>
        </div>
        <button class="btn btn-primary" onclick="createStudent()">Create student</button>
    </div>

    <!-- Student List -->
    <div class="card">
        <h2>Existing students</h2>
        <div class="student-list">
            <div th:each="s : ${students}" class="student-item">
                <div class="student-info">
                    <strong th:text="${s.name}"></strong>
                    <span th:text="${s.rollNumber}"></span>
                </div>
                <a class="btn-sm" th:href="@{/student/{id}(id=${s.id})}">Open dashboard →</a>
            </div>
            <p th:if="${#lists.isEmpty(students)}"
               style="color:#999; font-size:0.9rem;">No students yet. Add one above.</p>
        </div>
    </div>

</div>

<script>
    async function createStudent() {
      const name  = document.getElementById('name').value.trim();
      const roll  = document.getElementById('roll').value.trim();
      const email = document.getElementById('email').value.trim();
      const msg   = document.getElementById('msg');

      if (!name || !roll || !email) {
        msg.innerHTML = '<div class="alert alert-error">All fields are required.</div>';
        return;
      }

      const res = await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, rollNumber: roll, email })
      });

      if (res.ok) {
        const student = await res.json();
        msg.innerHTML = '<div class="alert alert-success">Student created! Redirecting...</div>';
        setTimeout(() => window.location.href = '/student/' + student.id, 800);
      } else {
        const err = await res.json();
        msg.innerHTML = `<div class="alert alert-error">${err.error || 'Something went wrong.'}</div>`;
      }
    }
</script>
</body>
</html>
